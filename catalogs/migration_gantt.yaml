# catalogs/migration_gantt.yaml
# Planning type d'une migration Carbonio, fourni par Julien et corrigé
# suite à échange (voir CHANGELOG) :
#   - id 17/18 (Démarrage MCO / Accès support) : demarre_apres réécrit en
#     "16#1" -> ne dépendent que de la 1ère bascule, jamais des suivantes.
#   - id 19/20/21 (Fin de migration) : demarre_apres réécrit en "16#last"
#     -> ne démarrent qu'après la DERNIÈRE bascule (tous les lots migrés).
#   - id 1 (Kickoff) et 21 (Recette) : jalon=oui conservé, durée/charge
#     ignorées au calcul (repli documenté avec Julien).
#   - id 18 (Mise en place accès support) : durée manquante dans le
#     fichier source -> valeur par défaut de 1 jour appliquée.
#
# groupe_repetition: "bascule" -> ce bloc de tâches (id 10 à 16) est
# dupliqué autant de fois que la question "Combien de bascules ?" le
# précise, avec des ids suffixés _lot1/_lot2/... Les références externes
# vers ce groupe utilisent #1 (première occurrence) ou #last (dernière).

