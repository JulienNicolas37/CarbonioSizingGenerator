# catalogs/sizing_rules.yaml
# Règles de dimensionnement — programme, jamais dupliquées dans une config client.

base_minimum:
  # Toujours présent, quel que soit le nombre de comptes
  proxy_mta_pair:
    count: 2
    zone: DMZ
    components: [proxy, mta_in, mta_auth, mta_out]   # colocalisés tant que < seuil HA
  services:
    count: 3
    zone: LAN
    # Répartition standard sur les 3 VM Services (pattern services01/02/03
    # du Générateur de DAT) :
    #   services01: [mesh, directory_master]
    #   services02: [mesh, directory_replica]
    #   services03: [mesh, database]
  mailstore:
    count: 1
    zone: LAN

ha_scaling:
  # Paliers progressifs d'éclatement de la paire proxy_mta_pair de base.
  # Le moteur retient le palier le plus élevé dont min_accounts <= comptes
  # ET dont toutes les conditions "requires" (si présentes) sont
  # satisfaites — sinon il retombe sur le palier qualifiant précédent.
  tiers:
    - level: 0
      min_accounts: 0
      groups:
        - id_prefix: "proxy_mta"
          components: [proxy, mta_in, mta_auth, mta_out]
          count: 2
          zone: DMZ

    - level: 1
      # Premier palier HA : on sépare "entrée/sortie" (mta_in+mta_out)
      # de "accès utilisateur" (proxy+mta_auth).
      min_accounts: 4000
      groups:
        - id_prefix: "proxy_auth"
          components: [proxy, mta_auth]
          count: 2
          zone: DMZ
        - id_prefix: "mta_inout"
          components: [mta_in, mta_out]
          count: 2
          zone: DMZ

    - level: 2
      # mta_in et mta_out prennent chacun leur propre paire de VM.
      min_accounts: 10000
      groups:
        - id_prefix: "proxy_auth"
          components: [proxy, mta_auth]
          count: 2
          zone: DMZ
        - id_prefix: "mta_in"
          components: [mta_in]
          count: 2
          zone: DMZ
        - id_prefix: "mta_out"
          components: [mta_out]
          count: 2
          zone: DMZ

    - level: 3
      # proxy et mta_auth se séparent à leur tour, mais seulement si
      # l'IMAP en accès direct est proposé aux utilisateurs (sinon on
      # reste au palier 2, même au-delà de 20000 comptes).
      min_accounts: 20000
      requires: [imap]
      groups:
        - id_prefix: "proxy"
          components: [proxy]
          count: 2
          zone: DMZ
        - id_prefix: "mta_auth"
          components: [mta_auth]
          count: 2
          zone: DMZ
        - id_prefix: "mta_in"
          components: [mta_in]
          count: 2
          zone: DMZ
        - id_prefix: "mta_out"
          components: [mta_out]
          count: 2
          zone: DMZ

  # Question posée uniquement quand elle devient pertinente (comptes
  # proches ou au-delà de 20000) — pas systématiquement dès le début du
  # questionnaire.
  conditional_questions:
    imap:
      prompt: "L'accès IMAP direct est-il proposé aux utilisateurs ?"
      ask_when_accounts_gte: 20000
      default: true

  selection:
    # Le palier calculé à partir du nombre de comptes (+ IMAP le cas
    # échéant) est une SUGGESTION, jamais imposée automatiquement. En
    # mode interactif, l'utilisateur voit la proposition et choisit de
    # l'appliquer ou de sélectionner un autre palier manuellement. En
    # mode --client (config existante), le champ infra.ha_tier de la
    # config fait foi — "auto" recalcule la suggestion, un entier (0-3)
    # force ce palier explicitement.
    mode: "suggested_with_override"
    prompt: >
      Palier de répartition de charge suggéré d'après {comptes} comptes
      {et_imap} : palier {level} ({resume_groups}). Voulez-vous appliquer
      cette suggestion, ou choisir un autre palier ?
    config_field: "infra.ha_tier"   # "auto" (défaut) | 0 | 1 | 2 | 3

mailstore_scaling:
  # Un mailstore = jusqu'à 5000 comptes ET jusqu'à 5 To de données en
  # stockage block (le premier seuil atteint déclenche un mailstore
  # supplémentaire).
  max_accounts_per_mailstore: 5000
  max_block_data_to_per_mailstore: 5
  # Si stockage Objet ACTIF ET module HSM ACTIVÉ : la donnée est
  # effectivement déportée vers le stockage secondaire (S3), donc le
  # stockage block n'est plus le facteur dimensionnant pour déterminer le
  # NOMBRE de mailstores (seul le nombre de comptes compte). Sans HSM
  # activé (même avec Stockage Objet coché), tout reste sur le stockage
  # primaire : la règle de volumétrie s'applique normalement.
  object_storage_ignores_volumetry: true

  selection:
    # Comme pour ha_scaling : le nombre de mailstores calculé par la règle
    # ci-dessus est une SUGGESTION, ajustable par l'utilisateur — mais pas
    # au fil du questionnaire (la donnée définitive de comptes/volumétrie
    # n'est connue qu'à la fin) : ajustement proposé lors de la
    # rétrospective finale (voir review_step ci-dessous).
    mode: "suggested_with_override"
    config_field: "infra.mailstore_count"   # "auto" (défaut) | entier explicite

  disque_par_mailstore:
    # Volumétrie moyenne par mailstore = volumétrie totale / nombre de
    # mailstores, arrondie au demi-To supérieur — appliquée uniformément
    # à chaque mailstore (pas de répartition différenciée).
    round_to_half_tb: true

    # --- Cas stockage Objet + HSM actif ---
    # HYPOTHÈSE (à valider/ajuster) : le stockage primaire (block) est
    # dimensionné pour tenir la rétention demandée, à raison de
    # 200 Go pour 7 jours de rétention (soit ~28,6 Go/jour), mis à
    # l'échelle linéairement si la rétention diffère. Le reste de la
    # volumétrie moyenne part sur le stockage secondaire (S3 via HSM).
    hsm_primary_gb_reference: 200
    hsm_reference_retention_days: 7

    # --- Backup (si activé) ---
    # 1,3 fois la taille cumulée des stockages primaire + secondaire
    # effectivement utilisés pour ce mailstore.
    backup_multiplier: 1.3

    # Disque "Backup metadata" (rapide) : valeur FIXE ajoutée par
    # mailstore dès que les backups sont activés, quelle que soit la
    # taille réelle des backups — pas de formule, juste un disque dédié
    # au catalogue/index du logiciel de sauvegarde. Ajustable selon le
    # retour d'expérience.
    backup_metadata_gb: 200

    # --- Marge de capacité (mise en place d'une nouvelle plateforme) ---
    # La volumétrie du client représente son USAGE réel, pas une capacité
    # à provisionner telle quelle : sans marge, le stockage serait déjà
    # saturé à l'issue de la migration (plus de place pour la croissance
    # quotidienne). On applique donc une marge à chacun des 3 supports
    # (primaire/block, secondaire/S3, backup) telle que headroom_pct % de
    # la capacité TOTALE provisionnée reste disponible :
    #   capacité = usage / (1 - headroom_pct/100)
    # Résultat arrondi à la centaine de Go la plus proche.
    headroom_pct: 30

review_step:
  # Étape de fin de questionnaire (mode interactif uniquement) : récapitule
  # les valeurs calculées automatiquement avant de générer le YAML client.
  description: >
    Affiche un résumé (palier HA proxy/MTA retenu, nombre de mailstores,
    nœuds Application01/02, usine de migration le cas échéant) et permet
    d'ajuster manuellement le nombre de VM mailstore avant validation
    finale. Les autres valeurs du résumé restent informatives à ce stade
    (non éditables ici), sauf évolution future de ce mécanisme.
  editable_fields: [infra.mailstore_count]

application_grouping:
  # Un nœud "ApplicationNN" par groupe, créé seulement si au moins un des
  # services du groupe est sélectionné par le client.
  application_01:
    services: [chat, tache]
    label: "Application01 — Chat + Tâches"
  application_02:
    services: [files, edition_collaborative]
    label: "Application02 — Files + Édition collaborative"

standalone_nodes:
  # Composants avec leur propre VM dédiée, jamais partagée, créés
  # seulement si le service correspondant est sélectionné.
  visio:
    components: [videoconf]
    zone: DMZ

storage_categories:
  # Catégories de synthèse utilisées dans le chapitre "Bilan des besoins"
  # (regroupement des colonnes disque détaillées du chapitre "Prérequis
  # techniques"). Modifiable ici sans toucher au code : chaque catégorie
  # liste les champs de sizing (nodes[].sizing.*) qui la composent.
  categories:
    disque_rapide:
      fields: [disk_os_gb, disk_appli_gb, disk_store_gb, disk_backup_metadata_gb]
    disque_lent:
      fields: []
    stockage_objet:
      fields: []
  # Les champs backup et secondaire sont routés dynamiquement selon le
  # contexte du client (pas une composition fixe comme les champs
  # ci-dessus) :
  backup_field: disk_backup_gb
  backup_category_if_s3: stockage_objet
  backup_category_if_not_s3: disque_lent
  # Le secondaire (délestage HSM) va en "stockage_objet" seulement si le
  # Stockage Objet est réellement actif ; sinon (HSM sans Stockage Objet
  # -> délestage vers un disque lent local) il va en "disque_lent".
  secondaire_field: disk_secondaire_gb
  secondaire_category_if_s3: stockage_objet
  secondaire_category_if_not_s3: disque_lent

optional_components:
  # Composants activés par une question dédiée du questionnaire, pas par
  # la liste de services standard.
  migration_factory:
    prompt: "Y a-t-il une usine de migration sur l'infrastructure client ?"
    default: false
    count: 1
    zone: LAN
    temporary: true   # à retirer de l'infra après la migration — signalé comme tel dans le PDF
